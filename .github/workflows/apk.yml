name: APK
on:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Construire l'APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Publier l'APK sur la branche apk
        run: |
          mkdir out && cp android/app/build/outputs/apk/release/app-release.apk out/VCT.apk
          cd out && git init -q -b apk && git add VCT.apk
          git -c user.name=apk-bot -c user.email=apk-bot@users.noreply.github.com commit -qm "APK ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
      - uses: actions/upload-artifact@v4
        with: { name: VCT-apk, path: out/VCT.apk }
